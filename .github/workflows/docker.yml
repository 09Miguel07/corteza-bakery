name: docker

# Publica la imagen del front en GitHub Container Registry cuando cambia main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dueño en minúsculas (GHCR lo exige)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/corteza-web:latest
            ghcr.io/${{ env.OWNER }}/corteza-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
