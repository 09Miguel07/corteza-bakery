name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and component tests (Vitest) with coverage
        run: npx ng test --watch=false --coverage
      - name: Production build
        run: npx ng build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
